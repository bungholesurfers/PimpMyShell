[package]
name = "pms-art"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PimpMyShell's icons and installer pictures: a customizer, and their rendering from SVG (cargo xtask art)"
publish = false

[dependencies]
# SVG rendering, pure Rust. Pinned.
resvg = "=0.49.0"
png = "0.18.1"
base64 = "0.23"
eframe = "0.37"
pms-ui = { path = "../pms-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
