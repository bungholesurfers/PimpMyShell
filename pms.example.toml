# PimpMyShell's defaults, and every option. Your own %APPDATA%\PimpMyShell\pms.toml holds only what you change, on top
# of these, so that better defaults still reach you. (With config_version = 2 in it, as it starts out. A [[meter]] there
# with one of the labels below changes that meter; `unset = ["key"]` clears a default; `removed_meters` and `meter_order`
# say which shipped meters go, and in what order. The settings window writes all of this for you.)
#   pms daemon                 keep it applied (foreground; Ctrl+C restores the stock taskbar)
#   pms autostart on           run the windowless daemon at every logon
#   pms meters <this file>     just the meters, without the daemon
# The daemon reloads this file when it changes. Every section is optional.

# Default meter sample interval (each [[meter]] may set its own interval_ms).
interval_ms = 1000

# Value text font (fixed-width by default): value_font = "Cascadia Mono, Consolas"

# Meter height: "compact" (3/4 of the taskbar), "tall" (default, halfway to full) or "full".
# When space runs short the strip squeezes (spacing, graphics, then text width) and finally
# hides meters from the end of the list; order them by importance.
meter_height = "tall"     # pies, graphs and gauges: compact (75% of the taskbar), tall (87.5%), full
bar_height   = "full"     # meters of bars (threads, engines, disks, adapters): the same; full stops a pixel short of the edges

# Look: "auto" follows Windows' light/dark mode for the taskbar (Settings > Personalization >
# Colors > "Choose your default Windows mode"); or "dark" / "light". It picks the backdrop below and
# whether PimpMyShell's text is light or dark.
theme = "auto"

# Frame-rate cap for the long-running animations (the hot-mic alert): fewer frames, less work for
# the compositor (on a 240 Hz display, 60 fps took its GPU time for the alert down by ~40%, 30 by ~65%).
# max_fps applies always (unset: none, the display's full rate); battery_fps while the PC runs on its
# battery (unset: 30; 0: none). The lower one wins.
# max_fps     = 60
# battery_fps = 30

# GPU meters and agg = "engine" counters leave out software adapters - Microsoft Basic Render Driver
# (WARP), which Windows keeps for when there's no GPU driver, and whose "GPU" work is really CPU work.
# software_gpus = true

# While a game fills the screen and keeps your graphics card busy, the TVs show GAME ON and draw nothing, Twatch TVs make way, and
# the console stops, unless you've played it since it started (then it rests). All come back when the game's over. On by default.
# rest_for_games = false

# While a window fills the screen the taskbar's on, so the taskbar can't be seen (a game, a video), the TVs stop drawing, the console
# rests, and Twatch TVs with their sound off stop; ones with sound go on playing it. Back the moment the taskbar is. On by default.
# rest_when_covered = false

# A TV arriving on channel 6, even by shuffling, switches its console on (the default). Off, channel 6 shows no signal until
# you switch the console on yourself.
# console_autostart = false

# A TV starting up (PimpMyShell starting, or a TV added) flips up through its channels, from tv_intro_from to tv_intro_to,
# where it stays: by default from Captain Midnight's 1295, round to the console on channel 6. Off, it comes on where it was left.
# tv_intro      = false
# tv_intro_from = 1295
# tv_intro_to   = 6

# How long a shuffling TV stays on a channel, for all of them: 5 to 3600 seconds. Each is late by its own random amount, up to a
# quarter of that, unless shuffle_jitter is off, when they all change together.
# shuffle_seconds = 30
# shuffle_jitter  = false

# A notification when Explorer has at least 10 old copies of our DLL and 300 MB of memory. Explorer only restarts if you ask.
# notify_explorer = false

# Software update. update_check: whether the daemon checks GitHub for a newer version by itself - a while
# after each start (1 to 30 minutes), then every day or two - and downloads it; it installs only once you
# say so. On by default, but the first run asks you first (a minute in), and checks nothing until you
# answer: OK, or closing the question, is on; "No, don't check" is off. A check starts by reading
# https://raw.githubusercontent.com/bungholesurfers/PimpMyShell/main/update/stable.txt (on the latest
# channel, https://github.com/bungholesurfers/PimpMyShell/releases/latest).
# update_channel: "stable" (the version the repository's update/stable.txt names) or "latest" (the
# newest release published). Only installers signed with PimpMyShell's release key are ever run.
# update_check   = true
# update_channel = "stable"

# [backdrop]: replace the stock acrylic with PimpMyShell's (blur + tint + grain). Omit the section
# to keep the stock acrylic.
[backdrop]
tint  = "#7F060606"   # #AARRGGBB over the blurred desktop; alpha = opacity
grain = 0.01          # 0 = no grain
# gaps = "#18FFFFFF"  # paint the free space between buttons

# The look in light mode (without this table: tint #C8F3F3F3, with [backdrop]'s grain and gaps).
[backdrop.light]
tint  = "#C8F3F3F3"
grain = 0.01

# [hotmic]: wash the taskbar in a breathing color while any app has the microphone open.
[hotmic]
color     = "#E53935"
period_ms = 1600      # one breath; 0 = steady
low       = 0.25      # opacity range of the breath
high      = 0.7
broad_ms  = 5000      # whole-taskbar warning first, then it settles around the "in use by" label
ignore    = []        # e.g. ["obs64.exe"]: substrings of the app's consent-store key
position  = "tray"    # where the "in use by" label goes: "tray", after the meters, or "start", before them

# [twatch]: a Twatch TV plays your favorite Twitch channels. It's off until there's a meter for it, which Settings > Twatch TV adds:
#
#   [[meter]]
#   label = "Twatch TV"
#   style = "screen"
#   set   = "twatch"
#
#   [twatch]
#   (your favorites live beside this file, in pms-twatch-watchlist.txt: one channel per line, best first)
#   more_sets   = 0                            # up to 2 more sets by themselves, while more favorites are live
#   pictures    = "low_memory"                 # stills in place of video: "never", "initial" (until a set is clicked), "low_memory" or "always"
#   notify_live = true                         # a notification when a favorite goes live
#   volume      = 100                          # how loud every set is, 0 to 100, when its sound is on
#   metered_pictures = true                    # stills in place of video while Windows says the connection is metered
#   top_quality = "480p"                       # "1080p60", "720p60", "720p", "480p" or "360p"; it goes lower by itself
#   higher_favorite = "switch"                 # a higher favorite going live: "switch" to it, or "stay" until this one ends
#   check_seconds = 600                        # how often each favorite is looked at: in no order, spread out, never two at once
#   check_extra_seconds = 300                  # plus a random wait of up to this for each, picked afresh each time
#   media_controls = "never"                   # in Windows' media controls (volume flyout, lock screen, media keys): "never", "unmuted" or "playing"

# The network settings live in a file of their own beside this one, pms-network.toml, so that this file can be shared without
# them: a SOCKS5 proxy, and what goes through it (Settings > Network says what each sends where). Nothing goes through it until
# it's switched on, and whatever's switched on and can't reach the proxy fails, rather than go without it. In pms-network.toml:
#
#   proxy       = "socks5h://127.0.0.1:9050"   # socks5h looks names up at the proxy too; "user:password@" before the host if it wants them
#   live_checks = true                         # Twatch TV: who's live, and pictures
#   streams     = true                         # Twitch streams: Streamlink finding them (it's told --http-proxy) and the video
#                                              # itself (PimpMyShell fetches it, not Windows), together, as the same somebody
#   updates     = true                         # PimpMyShell's update checks and downloads
#   downloads   = true                         # games, and Streamlink itself
#   isolate     = true                         # each of those with a random user name and password of its own (Tor stream isolation)

# [toasts]: show notifications inside the taskbar (the tray slides away meanwhile) instead of
# as popups - modern toasts and old-style tray balloons alike. Native banners are switched off per app (every app
# that can notify, ahead of its first toast) while the daemon runs and restored when it stops. Clicking a toast or
# its buttons acts like clicking the real one. New toasts stack on top of the ones showing; flick a card off to the
# right to dismiss it. Do not disturb and full-screen apps still hold toasts back.
[toasts]
# enabled   = false   # off, its settings kept (what the notice about notification access's "Keep Windows notifications" sets)
duration_ms = 7000    # each toast in front (one that comes forward again with more behind it: at most 4 s). Toasts that
                      # ask for duration="long" get at least 25 s, and alarms, calls and reminders with a button stay
                      # until you answer them, as they do in Windows
# position  = "tray"    # where cards stop: left of "clock" (default), "tray", "tv" (your first TV) or "mic" (the Hot Mic
                        # label). Those two, and what's right of them, stay in sight; one that isn't showing counts as
                        # the tray. On a full taskbar, cards cover the whole tray
# style     = "pimped"  # gold cards with a sheen sweeping across (default: "standard")
# confirm_clicks = "window"  # before a notification opens something, ask in a window with room for every detail
                             # (default: "card", in the notification itself; "off": don't ask)
ignore      = []      # apps that keep native banners (name or AUMID substring), e.g. ["Teams"]

# [start_glow]: a glow behind the Start button - none at rest, `hover` (its opacity) while the pointer
# is over it, the brighter `press` while it's pressed, `open` while the Start menu is open (from the
# Windows key too); fading over hover_ms, or the quicker press_ms into and out of a press; reaching
# hover_radius, or press_radius while pressed (DIPs). Omit the section for the stock button.
[start_glow]
color        = "#4CC2FF"
hover        = 0.45
press        = 0.9
open         = 0.6
hover_ms     = 220
press_ms     = 70
hover_radius = 120
press_radius = 170

# [app_glow]: the same behind every app's taskbar button, in the color its icon shows most of.
[app_glow]
hover        = 0.4
press        = 0.8
hover_ms     = 220
press_ms     = 70
hover_radius = 90
press_radius = 130

# [counters]: name = 'English PDH path', or { path = '...', agg = "...", default = <n> }.
#   Wildcard instances (*) are aggregated, skipping `_Total`: agg = "sum" (default), "max",
#   "min", "avg", or "engine" (GPU Engine counters: per-engine sum, then the busiest engine,
#   which is how Task Manager computes GPU %). `default` stands in when the counter can't be read.
#   Browse paths with:  typeperf -q   /   typeperf -qx "GPU Engine"
#
# Builtins usable in expressions: ram_total, vram_total (dedicated memory of all GPUs),
#   swap_total, swap_used (pagefiles, bytes, live), cpu_count.
#
# [[meter]]:
#   label, unit ("%", "bytes", "bytes/s", "bits/s", or any suffix), decimals
#   style        "history" (sparkline, default), "bar" (gauge with a peak marker),
#                "pie" (slices), "cores" (a user/kernel bar per CPU thread, grouped by topology),
#                "engines" (a bar per GPU engine that has shown activity),
#                "bars" (a vertical bar per expression; names = [...] label them in tooltips),
#                "disks" (write and read bars per disk), "nics" (up and down bars per network interface):
#                the disk Windows is on, and the interface the route to the internet takes, always show,
#                first; the others while busy, busiest first. No expr: they read their own counters.
#   expr         expression (+ - * / ( ) min max abs); for a pie, a list: one per slice
#   max          full scale: number or expression; omitted = auto-scale (pie: slices' sum)
#   color        #RRGGBB / #AARRGGBB; colors = [...] for pie slices, cores [user, kernel], disks [write, read],
#                nics [up, down]
#   group        meters in different groups get a separator between them
#   value        false: no value text (bar, pie, cores, engines, bars, disks, nics); the tooltip still has it
#   tooltip      false: no hover tooltip
#   show_above   only show while the value is at least this (number or expression)
#   show_when    only show while another level says it matters: { expr = "...", at = <n>, until = <n> } shows
#                the meter once expr reaches `at`, and hides it once expr is back under `until` (default: at)
#   names        pie / bars: a name per slice or bar, for the tooltip; disks / nics: each device's two bars
#   bar_width    cores / engines / bars / disks / nics: DIPs per bar
#   caption      false: no label beside the meter on the taskbar (the tooltip still has it)
#   sideways     true: the label on its side, reading down, for less room across (a disk's or GPU's too); on by
#                default for disks and nics
#   snug         true: right against the meter before it, no separator or spacing
#   glow         cores / engines: "level" (default: by load now), "heat" (by how hot the bars have got
#                working: full in ~8 s at 100%, cold ~30 s after; brighter fills too), or "off"
#   kernel       cores: "bottom" (default: each thread's kernel time at the bottom of its bar, user time above) or "top"
#   vendor_label engines: "short" (default: NV, RAD; the rest as tickers) or "ticker" (NVDA, AMD, INTC, QCOM, MSFT)
#   per_gpu      true: one of this meter per graphics adapter with dedicated memory (expr, max, color filled in)
#   min_memory_mb per_gpu: the least dedicated memory an adapter needs for one (default 1024; built-in graphics
#                often report a small reserved slice, which would sit near full)
#   label_inside pie: label inside the pie: "always", "auto" (only when crowded), "never" (default)
#   pressure     pie: how full its first slice gets before the resource is tight; the rim's glow swells from there
#                (default 0.8). Below a third full a pie has no glow; it fades in by two thirds.
#   time_axis    history: "log" (default: newest samples full width, older ones ever more
#                compressed, TMOG-style) or "linear"
#   history_seconds  history: how far back the graph reaches (default 300)
#   hold_seconds engines / disks / nics: an idle GPU's, disk's or interface's bars fall off after this long
#                (default 15; 0 = never); the most recently active GPU always stays
#   engines_fall_off  engines: idle engines fall off too, each on its own (default false: whole GPUs only)
#   interval_ms  this meter's own update rate (floor: the system timer resolution, >= 16 ms)
[counters]
gpu       = { path = '\GPU Engine(*)\Utilization Percentage', agg = "engine" }
mem_avail = '\Memory\Available Bytes'
modified  = '\Memory\Modified Page List Bytes'
standby_n = '\Memory\Standby Cache Normal Priority Bytes'
standby_r = '\Memory\Standby Cache Reserve Bytes'
standby_c = '\Memory\Standby Cache Core Bytes'
vram      = { path = '\GPU Adapter Memory(*)\Dedicated Usage', agg = "sum" }
commit    = '\Memory\% Committed Bytes In Use'
disk_read  = '\PhysicalDisk(_Total)\Disk Read Bytes/sec'
disk_write = '\PhysicalDisk(_Total)\Disk Write Bytes/sec'
net_rx    = { path = '\Network Interface(*)\Bytes Received/sec', agg = "sum" }
net_tx    = { path = '\Network Interface(*)\Bytes Sent/sec', agg = "sum" }

[[meter]]
label       = "CPU"
group       = "cpu"
style       = "cores"
glow        = "heat"       # threads heat up as they work and glow hotter; "level" glows by load now; "off"
interval_ms = 250
caption     = false
value       = false        # tooltips show each thread's user/kernel %
# bar_width = 3.6          # DIPs per thread bar (default by thread count)
colors      = ["#66BB6A", "#E040FB"]   # user, kernel
kernel      = "bottom"     # kernel time at the bottom of each bar, user time stacked above it; "top": the other way

[[meter]]
label  = "RAM"            # in the tooltip; caption = false keeps it off the taskbar
caption = false
snug   = true             # right against CPU: no separator, no spacing
group  = "memory"
style  = "pie"
# Like Task Manager's memory composition: in use, modified (waiting to be written), standby (cache).
expr   = ["ram_total - mem_avail - modified", "modified", "standby_n + standby_r + standby_c"]
names  = ["in use", "modified", "standby"]
colors = ["#AED581", "#FFFFFF", "#50AED581"]  # modified: white, next to the green: wet ink, written but not yet saved to disk
slice_glow = "modified"    # this slice glows, following it as it grows and shrinks (by its name above)
slice_glow_extend   = 2.5  # how far it can stand out past the pie's edge: at rest not at all, and more the faster its amount changes
slice_glow_radius   = 4    # how far the glow reaches
slice_glow_strength = 1    # 0 to 1
# slice_glow_color    = "#FFB74D"  # default: the slice's own
# slice_glow_pulse_ms = 2000       # a slow pulse (default 0: it holds steady)
max    = "ram_total"
unit   = "bytes"
value  = false
# Windows starts trimming working sets and paging harder once in-use memory passes ~80% of RAM.
pressure = 0.8
# label_inside = "auto"   # put the label inside the pie when crowded ("always", "never" = default)

[[meter]]
label = "SWAP"           # the pagefile, only when it matters (and never without one)
caption = false
group = "memory"
style = "pie"
expr  = "swap_used"
max   = "swap_total"
color = "#FFB74D"
unit  = "bytes"
# Windows always keeps some pages in the pagefile, which says nothing on its own: it starts to matter once
# physical memory runs short. So: shown once 85% of RAM is in use (available memory - free plus the standby
# cache - down to 15%), until that's back under 80%.
show_when = { expr = "1 - mem_avail / ram_total", at = 0.85, until = 0.8 }

[[meter]]
label = "COMMIT"         # only when commit gets high: allocations fail at 100%
group = "memory"
show_above = 80
expr  = "commit"
color = "#FF8A65"
max   = 100
unit  = "%"

[[meter]]
label = "GPU"            # a bar per engine that has done work lately; hover for names
group = "gpu"
style = "engines"
glow  = "heat"
# vendor_label = "ticker" # NVDA, AMD instead of NV, RAD
color = "#BA68C8"        # for GPUs of a maker PimpMyShell doesn't know
value = false
engines_fall_off = true  # idle engines fall off too, each on its own, hold_seconds after they stop (default 15)
# Each GPU is labelled by its maker in place of this label - NV, RAD, INTC, QCOM, MSFT - its bars lit
# in the maker's colors, with a glow of them around that brightens as it works. vendors = false: plain.
# vendors = false
# or the busiest engine as a sparkline:
# expr = "min(gpu, 100)"
# max  = 100
# unit = "%"

[[meter]]
label = "VRAM"
caption = false
group = "gpu"
style = "pie"
# A pie for every graphics adapter with at least min_memory_mb (1024) of dedicated memory, each reading that
# adapter's memory against its size, in its maker's color. Without per_gpu, give expr/max/color yourself,
# e.g. expr = "vram", max = "vram_total" for all of them in one.
per_gpu = true
# A game's video memory budget is about 90% of the card's; past it, Windows moves textures out to system RAM (stutter).
pressure = 0.85
unit  = "bytes"
value = false

[[meter]]
label     = "DISK"           # in tooltips; each disk is labelled by its first drive letter (C:) on the taskbar
group     = "io"
style     = "disks"          # write and read bars per disk: the one Windows is on always, first; the others
                             # while they're busy, busiest first, falling off hold_seconds after they go idle
names     = ["write", "read"]
colors    = ["#FFD54F", "#FFA726"]
max       = 1073741824       # 1 GB/s
unit      = "bytes/s"
bar_width = 10               # twice the CPU bars (up to 16 threads)
value     = false
# hold_seconds = 15
# or all disks together, as two bars:
# style = "bars"
# expr  = ["disk_write", "disk_read"]

[[meter]]
label     = "NET"            # in tooltips; each interface is labelled by its kind (ETH, WiFi, CELL, VPN, BT)
group     = "io"
style     = "nics"           # up and down bars per network interface: the one the route to the internet takes
                             # always, first; the others while they're busy
names     = ["sent", "received"]
colors    = ["#F06292", "#4DB6AC"]
max       = 1073741824
unit      = "bytes/s"
bar_width = 10
value     = false
# or all interfaces together:
# style = "bars"
# expr  = ["net_tx", "net_rx"]

[[meter]]
label = "TV"                 # a little TV: hover for its remote. With a game (Settings > TV), Space Pimpin' is on channel
style = "screen"             # 6. Add another [[meter]] with its own label and style = "screen" for another set.
