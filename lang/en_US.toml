streams_about = "When a favorite is live and a TwaTV plays video, Streamlink asks Twitch for the stream: https://gql.twitch.tv and https://usher.ttvnw.net. Then the stream's playlists and video come from Twitch's video servers, about 1 to 1.5 Mbps a TwaTV at 480p, for as long as one plays. The two go the same way, as the same somebody: the address Twitch gives for a stream names the IP address that asked for it. Streamlink is told to use the proxy. With the proxy on, PimpMyShell fetches the video itself, through it, and hands it to Windows' player; with it off, Windows' player fetches the video, and Windows' own proxy settings apply"
