confirm_card = "Ask in the notification"
confirm_card_help = "A quick question, right where you clicked"
confirm_window = "Ask in a window"
confirm_window_help = "Room for every path and argument"
confirm_off = "Don't ask"
confirm_off_help = "Notifications open what they open"
tv_title = "Your taskbar got cable"
tv_help = "There's a little TV down there now. Go on, point at it."
tv_remote = "The remote's in the tooltip"
tv_remote_help = "Channels, shuffle, power, and another TV if one isn't enough. They can all watch something different"
tv_channels = "Seven channels of nonsense"
tv_channels_help = "A test card, a crab that never hits the corner, static, the PimpCast, the space station's urine tank, a console, and a very angry man from 1986"
tv_off = "Off means out of your way"
