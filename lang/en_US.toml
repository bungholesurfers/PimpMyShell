no_streamlink_heading = "Get Streamlink for live video?"
no_streamlink_detail = "One of your favorites is live, but your TwaTVs need Streamlink to play live video, and it isn't installed. It's a separate, free program that turns a channel into a stream. It isn't in PimpMyShell's installer, and nothing is downloaded until you ask.\n\nTo get it, open the settings and select Download, under Streamlink. It's about 85 MB, the newest stable build from {url}, and we only accept a build that GitHub's runners uploaded and that matches GitHub's digest.\n\nIf you'd rather not, choose Always under Pictures instead of video. Your TwaTVs then show a new picture every minute, which doesn't need Streamlink."
no_streamlink_hint = "A favorite is live, but live video needs Streamlink. You can get it in Settings, under Twatch TV."
twatch_settings = "Open Twatch TV settings"
