have_it = "You've got it"
download = "Download"
freedoom_help = "Free, with its own art and levels. Both its games: Phase 1 and Phase 2. 24 MB."
shareware = "Doom (shareware episode)"
shareware_help = "The real first episode, unmodified. 1.4 MB. You'll see id Software's license first."
own_game = "A game of your own"
own_game_help = "Own the real thing? Drop an IWAD, like doom2.wad, in this folder"
open_folder = "Open folder"
waiting = "Waiting for you..."
downloading = "Downloading... {done} of {total} KB"
failed = "That didn't work: {why}"
twatch_title = "Twatch TV"
twatch_help = "Twitch, on a little flat-screen, live. Name your favorite channels and the best one that's on just plays. No account, no sign-in, nothing to click."
twatch_best = "Best first"
twatch_best_help = "Your favorites go in order. When a better one goes live, it takes over. When a few are on, up to three more sets come out by themselves"
twatch_pc = "Easy on your PC"
twatch_pc_help = "480p by default, and lower by itself when your PC or the network is struggling"
twatch_battery = "Easy on your battery"
twatch_battery_help = "Off the charger it shows a new picture every minute instead, and video comes back when you plug in"
twatch_on = "Put a Twatch TV on my taskbar"
twatch_on_help = "Then add your channels and get Streamlink in Settings, under Twatch TV"
twatch_next = "When you're done here, Settings opens on Twatch TV, to add your channels and get Streamlink for video"
