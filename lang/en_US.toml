# The Sandbox page.
sandbox = "Sandbox"
sandbox_about = "Always use protection. Each helper can run in an AppContainer, Windows' own sandbox, away from your files, your other programs, and anywhere on the network it has no business going. No method is 100% effective, but it beats going without."
sandbox_classic_hint = "Protection for the helpers"
sandbox_helpers = "Protection, by helper"
sandbox_column = "Sandbox"
sandbox_none = "none"
sandbox_details = "{kind} {name}\nSID: {sid}\nCapabilities: {capabilities}"
sandbox_trouble = "It couldn't start in its sandbox last time, so it didn't start at all: {why}"
# What each helper's sandbox does, a fact a line. Each one's heading is its program's file name, which isn't translated.
sandbox_fetch_help = "• AppContainer, LPAC: nothing that every app package may use\n• Capabilities: pimpmyshellInstallFiles, registryRead, and internetClient without the proxy\n• Files: PimpMyShell's folder, read and run; nothing else of yours\n• win32k off: no windows, GDI or Direct3D\n• With the proxy: no internetClient, only sockets to the proxy that PimpMyShell opens and hands it"
sandbox_twatch_help = "• AppContainer\n• Capabilities: pimpmyshellInstallFiles, and internetClient without the proxy\n• Files: PimpMyShell's folder, read and run; nothing else of yours\n• With the proxy: no internetClient, only a relay in its own container (pms-fetch.exe) that reaches the proxy"
sandbox_streamlink_help = "• Runs Streamlink, on the Python in Streamlink's folder\n• AppContainer\n• Capabilities: pimpmyshellInstallFiles, and internetClient without the proxy\n• Files: PimpMyShell's and Streamlink's folders, read and run; Streamlink's settings folder, read and write; nothing else of yours\n• With the proxy: no internetClient, only a relay in its own container (pms-fetch.exe) that reaches the proxy"
sandbox_poom_help = "• AppContainer, LPAC: nothing that every app package may use\n• Capabilities: pimpmyshellInstallFiles, registryRead\n• Files: PimpMyShell's folder and your WADs folder, read; its saves folder, read and write; nothing else of yours\n• win32k off: no windows, GDI or Direct3D\n• No network: no internetClient"
sandbox_always = "Every helper, wrapped or not:\n• Ends with whatever started it\n• Gets only the handles it's given, and no console\n• Can't start programs (the console starts its game, and nothing else)\n\nSwitching a sandbox:\n• On lets it into the folders it needs; off takes that back\n• A helper that's running starts again the new way\n• If its sandbox can't be made, it doesn't start at all"
sandbox_cant = "• Can't stop: a bug in your graphics card's driver, reached through the video. Keep Windows and the driver up to date\n• Does make sure: a wrapped helper that goes through your proxy has no network of its own, so it can't go around it. Windows holds it to that"
sandbox_see = "The Sandbox column on the General page shows what each process is really in, as Windows has it."
net_relay = "when a sandboxed helper goes through the proxy: in that helper's own sandbox, it passes the helper's connections on to sockets pmsd.exe (or pms-gui.exe, for Test) connected to the proxy, and to nothing else"
tv_channels_37 = "37: Number One"
tv_number_one = "Number One, channel 37"
iss_online = "Number One: the ISS's urine tank"
iss_online_help = "Channel 37 shows how full the International Space Station's urine tank is, from NASA's live telemetry (ISSLive!, by way of Lightstreamer), with the waste water and the drinking water a click away. It goes online for it in the background, as often as the tank needs: every 15 minutes while it fills, more often as it drains, and live when it's nearly empty, so that a flush is caught as it happens (see Network). Off, the channel says so, and shuffling passes it by. Inspired by Jaennaet's pISSStream"
iss_notify_flush = "Tell me when the ISS empties its urine tank"
iss_notify_flush_help = "A notification when a drain that started at 30% or more reaches the bottom: the station's urine processor has emptied the tank, to make drinking water"
net_iss_fetch = "asks for the station's telemetry, for pmsd.exe, and Test here, for pms-gui.exe. Each look is one request for a snapshot; live, one request after another, each held up to 30 seconds, and one to end the session"
iss_bumps = "PTV's bumps"
iss_bumps_help = "A few seconds of 3D now and then in place of the tank, as a channel's idents were: the P tumbling in, lifting off, going down the toilet, and an astronaut with swagger. Often is an ident on the quarter hour and a homage on the hour, an ident when you're back after 10 minutes away, a homage on a toilet when the station flushes, and one when you first tune in. Only while you'd see them: not on battery, or while nobody's at the PC"
iss_bumps_often = "Often"
iss_bumps_hourly = "On the hour only"
iss_bumps_off = "Off"

