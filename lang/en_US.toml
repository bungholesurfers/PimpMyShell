# The settings window.
[settings]
language = "Language"
language_help = "What PimpMyShell speaks: this window, the taskbar, its notifications"
language_auto = "The same as Windows"
console_autostart = "Start the PIMPBOX when a TV tunes in"
console_autostart_help = "Any TV landing on channel 304, even by shuffling, switches the console on. When this is off, channel 304 shows no signal until you switch it on"
console_demos = "Speed demos"
console_demos_help = "When nobody's playing, the console shows real speedruns of the game it's playing, from the Doom Speed Demo Archive (dsdarchive.com), in place of the game's own demos. Each is played here first, unseen, and shown only if it plays out exactly as it did for its runner. It goes online for them, as a download (see Network). They're shown from the next time the console's game starts: switch the console off and on with its remote, say"
demos_when = "When to look for demos"
demos_when_help = "Whenever PimpMyShell runs; or only while the console's on, so that the archive's only asked when you might be watching"
demos_when_always = "Whenever PimpMyShell runs"
demos_when_console = "Only while the console's on"
demos_every_hours = "Hours between looks"
demos_every_hours_help = "How long after one look there's another. Each downloads and checks a few demos, and asks the archive what's new if it's been long enough"
demos_at_once = "Demos per look"
demos_at_once_help = "How many demos are downloaded and checked in one look"
demos_gap_seconds = "Seconds between downloads"
demos_gap_seconds_help = "How long to wait after one download before the next, so as not to rush the archive"
demos_most = "Demos per game, in all"
demos_most_help = "How many demos are ever downloaded for a game. Once that many have been, no more are. The main categories come first, across every map"
demos_list_days = "Days between asking for the list"
demos_list_days_help = "How often the archive is asked what it has for this game: a few small requests each time"
demos_fired_at_least = "Shots fired, at least"
demos_fired_at_least_help = "Only runs where the player fires a weapon at least this many times are shown: one that never takes on anything is a dull one to watch. 0 shows every run that plays"
tv_notice = "DOOM is a registered trademark of id Software LLC, a ZeniMax Media company. PimpMyShell isn't affiliated with or endorsed by id Software, ZeniMax, Bethesda or Microsoft. The PIMPBOX, pms-pimpbox.exe, plays them with POOM, pms-poom.exe (room, a Doom engine), and both are under the GNU GPL version 2, with no warranty; their source is in PimpMyShell's repository on GitHub. The rest of PimpMyShell is under the MIT License, and each game keeps its own license."

# Each setting: its title, and what's said under it (the same name with _help).
theme = "Theme"
theme_help = "Choose dark or light for the taskbar's look, or follow your Windows mode"
meter_height = "Meter height"
meter_height_help = "How much of the taskbar's height pies, graphs, and gauges use"
bar_height = "Bar height"
bar_height_help = "How much of the taskbar's height meters made of bars use"
interval_ms = "Update interval"
interval_ms_help = "How often meters refresh, unless a meter has its own interval"
software_gpus = "Include software graphics adapters"
software_gpus_help = "Count Microsoft Basic Render Driver, which runs on the CPU, in GPU meters"
rest_when_covered = "Rest while the taskbar's covered"
rest_when_covered_help = "When a window fills the screen your taskbar's on (a game, a video, a presentation), nobody can see your TVs, so they stop drawing and the PIMPBOX rests. Twatch TVs with their sound off stop too; ones with sound go on playing it. All of it's back the moment the taskbar is"
rest_for_games = "Rest while you play"
rest_for_games_help = "When a game fills your screen and keeps your graphics card busy, your TVs show GAME ON and stop drawing, Twatch TVs make way, and the PIMPBOX stops, unless you've played it since it started. All come back about 20 seconds after the game"
max_fps = "Limit animation frame rate"
max_fps_help = "Cap ongoing animations, such as Hot Mic's and the notification rings. When it's off, they run at your display's refresh rate"
battery_fps = "Frame rate on battery"
battery_fps_help = "A lower cap while your PC runs on battery. 0 means no cap"
value_font = "Meter font"
value_font_help = "A fixed-width font keeps digits from shifting. Leave it empty to use Cascadia Mono, or Consolas"
update_check = "Check for updates automatically"
update_check_help = "We check GitHub a while after PimpMyShell starts (1 to 30 minutes), then every day or two. New versions download in the background, and you choose when to install them"
update_channel = "Update channel"
update_channel_help = "Stable gets a version once it has proven itself. Latest gets every release as soon as it's published"
update_warn = "Warn when update checks fail"
update_warn_help = "A notification when automatic checks can't run on this PC (the download helper's sandbox can't be made), or none has worked for a week. At most once each time PimpMyShell starts"
notify_explorer = "Tell me when Explorer could use a restart"
notify_explorer_help = "Windows can't unload what we've added to Explorer, so updates add up. When it's holding a lot, you get a notification. Explorer only restarts if you ask"
shuffle_seconds = "Time between shuffles"
shuffle_seconds_help = "How long a shuffling TV stays on a channel. This is for all your TVs, and their remotes can change it too"
shuffle_jitter = "Jitter"
shuffle_jitter_help = "Each shuffling TV changes channel a little late, by up to a quarter of the time above. When this is off, they all change together"
console_video = "Video mode"
console_video_help = "How big a picture the console puts out, which is what its window shows, as many times over as fits your screen. Nearly everything of its day used 480p. It changes at once, if the console's on"
tv_intro = "Channel surf when a TV starts up"
tv_intro_help = "When PimpMyShell starts, or you add a TV, it flips up through its channels before it settles. When this is off, it comes on at the channel it was left on"
tv_intro_from = "Surf from"
tv_intro_from_help = "The channel the run starts on"
tv_intro_to = "Surf to"
tv_intro_to_help = "Where the run ends, and the TV stays. On 304 with a game, the PIMPBOX starts"
twatch_media_controls = "Show in Windows' media controls"
twatch_media_controls_help = "Where Windows shows what's playing: the volume flyout, the lock screen, and your keyboard's media keys. It's never by default, so a TwaTV doesn't take over your media keys"
twatch_pictures = "Pictures instead of video"
twatch_pictures_help = "A still of the channel every minute, for hardly any CPU or network. It doesn't need Streamlink. On battery you get these anyway"
twatch_volume = "Volume"
twatch_volume_help = "How loud every TwaTV is, when its sound is on. Any set's remote can change it too"
twatch_metered_pictures = "Pictures on a metered connection"
twatch_metered_pictures_help = "Video takes about 1 to 1.5 Mbps a set at 480p. While Windows says your connection is metered, like a phone hotspot, sets show a picture a minute instead"
twatch_notify_live = "Tell me when a favorite goes live"
twatch_notify_live_help = "A notification, whichever TwaTV it ends up on. Select it to go to the channel"
twatch_top_quality = "Highest quality"
twatch_top_quality_help = "It goes lower by itself while your PC is busy or the network can't keep up, and a small light on the set says so. The remote says why"
twatch_frame_rate = "Frames a second"
twatch_frame_rate_help = "At most this many on each TwaTV. Every frame shown costs your PC's processor about the same, whatever the set's size, and those left out cost nothing: a stream at 60 shown at 30 takes half the work. At taskbar size, 30 looks as smooth"
twatch_more_sets = "Add TwaTVs by themselves"
twatch_more_sets_help = "While more favorites are live than you have TwaTVs, up to this many more appear, and they go away again when those streams end. Each one plays a stream of its own. At 0, a purple plus by your TwaTVs offers one instead"
twatch_more_sets_on = "Let TwaTVs come and go"
twatch_more_sets_on_help = "On, more TwaTVs appear by themselves while more favorites are live, as many as below. Off, none do, and that number is kept for when you turn it on again. The A beside your TwaTVs switches this too"
twatch_higher_favorite = "When a higher favorite goes live"
twatch_higher_favorite_help = "What every set does, unless its remote is set to This stream or This channel. Whatever it does, its remote tells you"
twatch_check_seconds = "How often to check each favorite"
twatch_check_seconds_help = "Every favorite is looked at about this often, whatever its place in the list: in a random order, spread out, never two at once. Each look is one small request for a picture, with no account. On battery, it's twice as long"
twatch_check_extra_seconds = "Plus a random wait of"
twatch_check_extra_seconds_help = "Added to each favorite's wait, a new amount every time, so that looks don't come like clockwork"
