twatch_no_streamlink = "Live video needs Streamlink"
twatch_no_streamlink_about = "You have favorites, but without Streamlink your TwaTVs can't play them. Download it below, or choose Always under Pictures instead of video, further down, for a still every minute."
twatch_pictures_never = "Never"
twatch_pictures_initial = "Until you click a TwaTV"
twatch_pictures_low_memory = "When RAM or VRAM is low"
twatch_pictures_always = "Always"
reset_all = "Reset settings"
reset_all_about = "Everything back to how it came. Your Twatch TV favorites, network settings, games and answer about updates stay"
reset_all_ask = "Every setting goes back to how it came, Twatch TV's included. Your Twatch TV favorites, your network settings, your games and your answer about updates stay. What your settings are now is kept beside them, as pms.toml.before-reset."
twatch_network = "What Twatch TV asks of the internet, and how to send it through a proxy, is under Network."
twatch_notice = "Twitch is a trademark of Twitch Interactive, Inc. PimpMyShell isn't affiliated with Twitch. Streamlink is a separate program under the BSD 2-Clause License, built by GitHub's runners from its own source."
network = "Network"
network_about = "Everything PimpMyShell uses the internet for, and a proxy to send any of it through. There's no account, no analytics and no ads: nothing about you or your PC is sent anywhere."
proxy = "SOCKS5 proxy"
proxy_about = "socks5h:// looks names up through the proxy too; socks5:// looks them up on this PC. Add user:password@ before the host if it needs them. Leave it empty for none"
proxy_isolate = "A random user name and password for each"
proxy_isolate_about = "For Tor's stream isolation: each of the uses below goes with a user name and password of its own, made up each time PimpMyShell starts and kept until it exits, so Tor puts them on circuits of their own. Each TwaTV's stream has one of its own too, for as long as it plays. They take the place of any in the address, and each use shows its own below"
proxy_limits = "We test all of this as we build it, but nothing is airtight, least of all the software PimpMyShell gets from elsewhere for you, like Streamlink: it does its own networking, and changes with its own releases.\n\nIf it matters that nothing gets out except through your proxy, have Windows make sure. Windows Firewall, or another filter built on the Windows Filtering Platform, can keep these from going anywhere but your proxy:\n\npmsd.exe, pms-gui.exe, pms-twatch.exe, and the python.exe in PimpMyShell's streamlink folder, which runs Streamlink"
network_unread = "PimpMyShell can't tell whether you wanted a proxy, so nothing goes online until pms-network.toml is fixed: no checking who's live, no Twatch TV video, no update checks and no downloads. Fix the file and save it, or apply a proxy here to replace it. To go without a proxy, delete the file."
proxy_unused = "Nothing goes through your proxy"
proxy_unused_about = "Everything still goes straight to where it's going. Switch on what should use the proxy below, or select Turn on all."
proxy_strict = "What's switched on here never goes without the proxy: if the proxy can't be reached, it fails until it can. What's switched off goes straight to where it's going."
network_else = "That's all of it. Windows does what it does by itself, and the notifications PimpMyShell shows come from your apps, not from the internet. Under each use above are the programs that do it, PimpMyShell's own and Streamlink, by their file names."
net_done_by = "Done by"
net_login = "SOCKS login"
net_login_user = "User name"
net_login_password = "Password"
net_login_direct = "None: this doesn't go through the proxy"
net_login_nowhere = "None: the proxy's address can't be used, so this goes nowhere"
net_login_without = "None: the proxy's address has no user name or password"
net_login_own = "PimpMyShell isn't running, so these are the settings' own, which Test goes by. It makes new ones each time it starts"
net_login_streams = "Each TwaTV's stream goes as a login of its own, made up when it's found and used for everything it does, from finding it to the last of its video. The one above is for Test"
net_login_stream = "TwaTV {n}, playing now"
net_login_no_streams = "No TwaTV is playing a stream now"
net_live_fetch = "checks who's live, and fetches and opens the pictures, for pmsd.exe, and Test here, for pms-gui.exe: what comes from Twitch is opened there, in neither of them"
net_streams_streamlink = "Streamlink, run in the Python that comes with it, in PimpMyShell's streamlink folder: asks Twitch for the stream. pmsd.exe starts it, and so does Test here"
net_streams_fetch = "fetches the stream's first playlist from Twitch, for pmsd.exe, and Test here, for pms-gui.exe"
net_streams_twatch = "fetches the playlists and the video, through the proxy when it's on. With it off, Windows' own player in this program fetches them, and Windows' proxy settings apply"
net_updates_fetch = "checks every day or two, and downloads the release (for pmsd.exe, and for pms-gui.exe when you check for updates here, or select Test). The installer runs only if the release's signed manifest vouches for it"
net_downloads_fetch = "games and Streamlink when you select Download, and Test here (for pms-gui.exe), and now and then, while a live stream won't open, whether a newer Streamlink is out (for pmsd.exe). With speed demos switched on for the PIMPBOX, the Doom Speed Demo Archive's list, once a week at most, and each demo once, unzipped here. Games and Streamlink are checked against their SHA-256 before anything's made of them; demos are checked by playing them, unseen"
hotmic = "Hot Mic"
hotmic_about = "Know when an app is using your microphone. The whole taskbar alerts first, then the alert settles around a label naming the apps, beside the system tray, or before your meters and TVs. An app that stops stays listed for 10 seconds."
toasts = "Notification Toast"
toasts_about = "Show notifications in the taskbar instead of as pop-ups. Their buttons still work, and they stay in notification center."

