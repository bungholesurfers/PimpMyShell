# What PimpMyShell says, in English. This is the source: it says which texts there are, and every other file in this
# folder is a translation of it. lang/README.md says how to add a language.
#
# A text is `name = "what it says"`, on one line. {braces} hold what's filled in when it's said: keep them, wherever in
# the sentence they belong. \" is a quote and \n a new line.

[language]
# What the language calls itself, in the list of languages.
name = "English"
# The Windows languages this is the one for, by how their names begin. Leave it out for one that's only ever chosen.
windows = "en"

# The first run: a few questions, a page each.
[welcome]
window_title = "Welcome to PimpMyShell"
window_title_news = "What's new in PimpMyShell"
language_title = "Which language do you speak?"
language_help = "Pick one. You can change it later in Settings, under General."
hello_title = "Welcome to the good life"
hello_help = "A few quick stops, and your taskbar is pimped. You can change all of it later in Settings."
style_title = "To pimp, or not to pimp?"
style_help = "Notifications show up in your taskbar. Here's how they can look."
style_standard = "Standard"
style_standard_help = "Clean, like the rest of Windows"
style_pimped = "Pimped"
style_pimped_help = "Gold, with a sheen that sweeps across"
confirm_title = "Inspect before you dip?"
