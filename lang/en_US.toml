newer_streamlink_detail = "Streamlink {have} couldn't open a channel that Twitch says is live. That usually means Twitch changed something, and a newer Streamlink is usually how that gets fixed.\n\nNothing has been downloaded. If you update, we'll only accept a build that GitHub's runners uploaded and that matches GitHub's digest. That proves it's the file the Streamlink project published. It doesn't prove the file is safe.\n\nYou can read about this release at {url}. To update, open the settings and select Get the newest."
