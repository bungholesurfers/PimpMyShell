general = "General"
general_about = ""
meters = "Meters"
meters_about = "Your meters, in their order on the taskbar, left to right. Select one to change it, and move it with the arrows. Where they go among your TVs is on the Widgets page."
power = "Power & performance"
power_about = "When PimpMyShell gets out of the way: when nobody can see it, for your games, on battery, and for your memory and your data."
power_by_itself = "Some of it happens by itself. On battery, a TV you leave alone sleeps, and Twatch TVs show pictures. When memory or video memory runs short, Twatch TVs make way, and so does the PIMPBOX, unless you've been playing it. When the PC is busy, TVs draw at half speed."
twatch_power = "Pictures instead of video, to save memory or data, are under Power & performance."
logs = "Logs"
logs_about = "What PimpMyShell writes down as it goes, to help fix things when they go wrong."
widgets = "Widgets"
widgets_about = "What's along the taskbar beside the system tray, in its order: your meters, together; each TV and Twatch TV; and the Hot Mic label, at one end or the other. When space runs short they squeeze up, then the ones nearest the tray hide first (never the Hot Mic label)."
widget_mic_first = "Its label, while an app uses your mic: first, before your meters and TVs"
widget_mic_last = "Its label, while an app uses your mic: last, beside the tray"
widgets_none = "Nothing's on the taskbar yet: add meters, a TV or a Twatch TV on their pages."
widgets_no_mic = "Hot Mic is off. Switched on, under Hot Mic, its label goes at one end of these."
order_note = "Twatch TVs that come and go by themselves follow the last one, and so do their buttons. Notification cards slide in over the tray's end: where they stop is under Notification Toast."
counters = "Performance counters"
counters_about = "The Windows performance counters your meters read, by their English paths. Use their names in meter expressions, along with ram_total, vram_total, swap_total, swap_used, and cpu_count. To find paths, run typeperf -q."
look = "Taskbar look"
look_about = "Replace the taskbar's standard acrylic with your own background, with a look for dark mode and one for light mode."
tv = "TV"
tv_about = "A little TV in your taskbar. Point at it for its remote: channels, shuffle, power, and another TV if one isn't enough. Channel 37 is Number One, the space station's urine tank: it's below. Channel 304 is the PIMPBOX, your console: its games are under PIMPBOX."
tv_help = "On the TV: click the picture to stop shuffling. On channel 304, click again to play; on 37, to see the station's other water. On battery, a TV you leave alone sleeps."
pimpbox = "PIMPBOX"
pimpbox_about = "A console on channel 304 of your TVs. Give it a game, and any TV tuned to 304 plays it. It plays Doom's games with POOM (room)."
pimpbox_help = "On a TV on channel 304, click the picture to play: a window opens on your desktop. Esc opens the game's menu. Alt+Tab, or clicking away, lets go of the mouse. Closing the window pauses the game. Changing the channel doesn't turn the console off: it has its own power button on the TV's remote. Asking for channel 304 with no game brings you here."
number_one = "Number One"
number_one_about = "Channel 37 of your TVs: how full the International Space Station's urine tank is, live from NASA, with PTV's bumps in between. These settings are on the TV page too."
order_hint = "To move it along the taskbar, use the arrows on the Widgets page."
twatch = "Twatch TV"
twatch_about = "A flat-screen set that plays your favorite Twitch channels while they're live, as live video in your taskbar. Point at it for its remote, and click the picture to open the channel. On battery it shows pictures instead, and goes back to video when you plug in. Live video needs Streamlink, just below."
twatch_favorites = "Your favorite channels, best first. Nothing else about you or your account is used: there's no sign-in."
twatch_drag = "Drag a channel to move it, or use its arrows."
twatch_as_text = "One channel per line, best first. Names, @names and twitch.tv links all work. Nothing changes until you save."
twatch_higher_switch = "Switch to it"
twatch_higher_stay = "Stay on what's playing"
