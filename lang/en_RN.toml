net_live_fetch = "checks who's on, and fetches and opens the pitchers, fer pmsd.exe, and try it here, fer pms-gui.exe: whut comes from Twitch gets opened there, in neither of em"  # en:67711e58
net_streams_streamlink = "Streamlink, run in the Python that comes with it, in PimpMyShell's streamlink folder: asks Twitch fer the stream. pmsd.exe starts it, and so does try it here"  # en:a56736f3
net_streams_fetch = "fetches the stream's first playlist from Twitch, fer pmsd.exe, and try it here, fer pms-gui.exe"  # en:c34966a8
net_streams_twatch = "fetches the playlists and the video, through the proxy when it's on. with it off, winders' own player in dis program fetches em, and winders' proxy settins apply"  # en:c777edf8
net_updates_fetch = "checks every day or two, and downloads the release (fer pmsd.exe, and fer pms-gui.exe when ya check fer updates here, or pick try it). the installer don't run unless the release's signed manifest vouches fer it"  # en:11ecd74d
net_downloads_fetch = "games and Streamlink when ya pick git it, and try it here (fer pms-gui.exe), and now and then, while a live stream won't open, whether a newer Streamlink is out (fer pmsd.exe). with speed demos switched on fer the game box, the Doom Speed Demo Archive's list, once a week at most, and each demo once, unzipped here. games and Streamlink git checked against their SHA-256 before anythin's made of em; demos git checked by playin em where ya cain't see"  # en:7470053d
hotmic = "hot mic"  # en:c81ea167
hotmic_about = "know when a app is usin yer microphone. the whole taskbar hollers first, then the alert settles round a label namin the apps, by the tray, or 'fore yer meters and tee-vees. a app that quits stays listed fer 10 seconds."  # en:61eb3044
