[procs]
explorer = "explorer.exe (the taskbar, with PimpMyShell's piece in it)"  # en:48190aa1
dwm_is = "Desktop Window Manager: winders' compositor. the taskbar's a XAML island whose visual tree, with PimpMyShell's doodads in it, is a tree a Windows.UI.Composition visuals that DWM puts together every frame. so the meters' and tee-vees' surfaces, the acrylic and them other effect brushes, and every composition animation (glows, ripples, toasts, the clicker's beam) is drawn here, on DWM's own GPU time and video memory, not in Explorer."  # en:dcd779d9
gpu_memory_is = "GPU figgers is winders' own per-process counters, the ones Task Manager shows. a card's got a engine fer each kind a work (3D, Video Decode, Copy and such). the GPU column adds up every engine a process is usin, so it kin go past 100%, where Task Manager shows just the busiest one; GPU engines names the ones it's usin, busiest first. the memory column is dedicated video memory committed to each process, which ain't whut it's got on the card: memory the card paged out to system RAM still counts, and a surface shared tween processes counts in each of em (most of all in dwm.exe, which holds every winder's). so a row kin make out a process takes more'n it really does, and the rows kin add up to more'n the card's got in use."  # en:c4567ff9

