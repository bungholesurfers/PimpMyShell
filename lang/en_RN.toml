spared_detail = "yer pee-see's low on memory, and most times the PIMPBOX would shut to free some up. you played this game, and shuttin it would lose whutever ya ain't saved, so it keeps on till it's restarted.\n\nto free that memory yerself, save yer game and switch the console off on the tee-vee's clicker."  # en:9f73e16e
