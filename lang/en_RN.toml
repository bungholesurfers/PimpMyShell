# the sandbox page
sandbox = "sandbox"  # en:f17bffc4
sandbox_about = "always use protection. each helper kin run in a AppContainer, winders' own sandbox, away from yer files, yer other programs, and anywheres on the network it ain't got no business goin. ain't no method 100% effective, but it beats goin without."  # en:989c5ad1
sandbox_classic_hint = "protection fer the helpers"  # en:5d8e593b
sandbox_helpers = "protection, by helper"  # en:b15aef85
sandbox_column = "sandbox"  # en:f17bffc4
sandbox_none = "nuthin"  # en:ada7afdb
sandbox_details = "{kind} {name}\nSID: {sid}\nwhut it's let have: {capabilities}"  # en:4a1f1206
sandbox_trouble = "it couldn't start in its sandbox last time, so it didn't start a-tall: {why}"  # en:5780c476
sandbox_fetch_help = "• AppContainer, LPAC: nuthin that ever app package kin use\n• capabilities: pimpmyshellInstallFiles, registryRead, and internetClient without the proxy\n• files: PimpMyShell's folder, read and run; nuthin else a yers\n• win32k off: no windows, GDI or Direct3D\n• with the proxy: no internetClient, only sockets to the proxy that PimpMyShell opens and hands it"  # en:a9d800d3
sandbox_twatch_help = "• AppContainer\n• capabilities: pimpmyshellInstallFiles, and internetClient without the proxy\n• files: PimpMyShell's folder, read and run; nuthin else a yers\n• with the proxy: no internetClient, only a relay in its own container (pms-fetch.exe) that reaches the proxy"  # en:f0767f25
sandbox_streamlink_help = "• runs Streamlink, on the Python in Streamlink's folder\n• AppContainer\n• capabilities: pimpmyshellInstallFiles, and internetClient without the proxy\n• files: PimpMyShell's and Streamlink's folders, read and run; Streamlink's settins folder, read and write; nuthin else a yers\n• with the proxy: no internetClient, only a relay in its own container (pms-fetch.exe) that reaches the proxy"  # en:88bbc5d4
sandbox_poom_help = "• AppContainer, LPAC: nuthin that ever app package kin use\n• capabilities: pimpmyshellInstallFiles, registryRead\n• files: PimpMyShell's folder and yer WADs folder, read; its saves folder, read and write; nuthin else a yers\n• win32k off: no windows, GDI or Direct3D\n• no network: no internetClient"  # en:bb7e1db9
sandbox_always = "every helper, wrapped up or not:\n• ends with whutever started it\n• gits only the handles it's give, and no console\n• cain't start no programs (the console starts its game, and nuthin else)\n\nswitchin a sandbox:\n• on lets it into the folders it needs; off takes that back\n• a helper that's runnin starts over the new way\n• if its sandbox cain't be made, it don't start a-tall"  # en:2ba586c2
sandbox_cant = "• cain't stop: a bug in yer graphics card's driver, reached through the video. keep winders and the driver up to date\n• does make sure: a wrapped-up helper that goes through yer proxy ain't got no network of its own, so it cain't sneak around it. winders holds it to that"  # en:140e89ec
sandbox_see = "the sandbox column on the gen'ral page shows whut each process is really in, like winders has it."  # en:f7aa8898
net_relay = "when a wrapped-up helper goes through the proxy: in that helper's own sandbox, it passes the helper's connections on to sockets pmsd.exe (or pms-gui.exe, fer try it) hooked up to the proxy, and to nuthin else"  # en:3022d423
