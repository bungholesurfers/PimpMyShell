net_login_nowhere = "nawp: the proxy's address won't work, so this don't go nowheres"  # en:d26fafd7
net_login_without = "nawp: the proxy's address ain't got no user name nor password"  # en:3876fe6d
net_login_own = "PimpMyShell ain't runnin, so these here are the settins' own, which try it goes by. it makes new ones ever time it starts"  # en:641e2760
net_login_streams = "ever TwaTV's stream goes by a login of its own, made up when it's found an used fer ever thing it does, from findin it to the last of its picture. the one up yonder is fer try it"  # en:21ea8a61
net_login_stream = "TwaTV {n}, a-playin now"  # en:69c8f821
