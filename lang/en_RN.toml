iss_about = "while Number One is switched on (under tee-vee), in the background: NASA's ISSLive! numbers, from https://push.lightstreamer.com, five of em at a time (the pee tank, its still, the dirty and drinkin water, and whether the station's got a signal). ever 15 minutes while the tank fills, more as it drains, live fer the last few minutes 'fore it's empty; half as often while yer gone or on battery. 'bout 100 to 150 asks a day. nothin goes with the ask but Lightstreamer's public client id fer demos"  # en:a4f9c7f5
