# What PimpMyShell says, in Redneck.
#
# en_RN is what Red Hat called its Redneck, which Donnie Barnes wrote for Red Hat Linux's setup tools in 1998 ("yep",
# "nawp", "back up!", "fergit it!"). This is in its manner: short, small letters, and never in a hurry. A few of its words
# are here as a tip of the cap ("yep", "nawp", "back up!", "keepa goin'", "yer dun!"); the rest is ours. What's legal stays
# in plain English, so that it still means what it has to.

[language]
name = "Redneck"

