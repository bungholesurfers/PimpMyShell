[net]
live = "who's on, and pitchers"  # en:0f0a1de1
live_about = "a lil request fer each favorite's preview pitcher, from https://static-cdn.jtvnw.net/previews-ttv/, as often as ya set under Twatch TV (every 10 to 15 minutes less'n ya change it, twice as long on battery), with no account. with pitchers 'stead a video, the pitcher itself, once a minute"  # en:74e67cd7
streams = "findin and playin streams"  # en:25cafcc0
streams_about = "when a favorite's on and a TwaTV plays video, Streamlink asks Twitch fer the stream: https://gql.twitch.tv and https://usher.ttvnw.net. then the stream's playlists and video come from Twitch's video servers, about 1 to 1.5 Mbps a TwaTV at 480p, fer as long as one plays. the two go the same way, as the same somebody: the address Twitch gives fer a stream names the IP address that asked fer it. Streamlink's told to use the proxy. with the proxy on, PimpMyShell fetches the video itself, through it, and hands it to winders' player; with it off, winders' player fetches the video, and winders' own proxy settins apply"  # en:4daa4a18
updates = "checkin fer updates"  # en:27b05f68
updates_about = "whut's newest, every day or two if ya said so: on steady, from https://raw.githubusercontent.com/bungholesurfers/PimpMyShell/main/update/stable.txt, and on latest, from https://github.com/bungholesurfers/PimpMyShell/releases/latest. then the release itself, from https://github.com/bungholesurfers/PimpMyShell/releases"  # en:d715e2a4
downloads = "downloads"  # en:539307de
downloads_about = "when ya pick git it: Freedoom from https://github.com/freedoom/freedoom/releases, Doom's shareware episode from https://deb.debian.org, Streamlink from https://github.com/streamlink/windows-builds by way a https://api.github.com, and, by itself, now and agin while a live stream won't open, askin there if a newer Streamlink would fix it. with speed demos switched on fer the PIMPBOX, whut https://dsdarchive.com has fer the game in it, once a week at most, and each demo from there once"  # en:b6ecd79e
