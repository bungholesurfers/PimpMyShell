iss_online_help = "channel 37 shows how full the space station's pee tank is, from NASA's own live numbers (ISSLive!, by way a Lightstreamer), with the dirty water and the drinkin water a poke away. it goes online fer it in the background, as often as the tank needs: ever 15 minutes while it fills, more as it drains, and live when it's near empty, so a flush gits caught right when it happens (see network). off, the channel says so, and shufflin goes right on by. got the idea from Jaennaet's pISSStream"  # en:a2a03f6a
iss_notify_flush = "holler when the space station empties its pee tank"  # en:d35a24ee
iss_notify_flush_help = "a notification when a drain that started at 30% or more hits bottom: the station's pee still done emptied the tank, to make drinkin water"  # en:a56cb3e7
net_iss_fetch = "asks fer the station's numbers, fer pmsd.exe, and try it here, fer pms-gui.exe. ever look is one ask; live, one ask after another, each held up to 30 seconds, and one to hang up"  # en:c33272a3
iss_bumps = "PTV's bumps"  # en:61512fda
iss_bumps_help = "a few seconds a 3D now and agin 'stead a the tank, like a channel's idents was: the P tumblin in, liftin off, goin down the commode, and a spaceman with some swagger. often is one on the quarter hour and a big un on the hour, one when ya git back after 10 minutes gone, one on the commode when the station flushes, and one when ya first tune in. only while ya'd see em: not on battery, nor when nobody's at the pee-see"  # en:905bfd11
