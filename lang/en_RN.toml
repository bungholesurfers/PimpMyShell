problem_detail = "{what}. it ain't nuthin you done, and yer taskbar's fine.\n\na report most times tells us why. it's got yer winders version, PimpMyShell's logs and settins, and how yer taskbar's laid out. it leaves out yer winders user name and whut yer notifications say.\n\npick save a report to see it. nuthin gits sent: you decide whether to post it.\n\nthe particulars: {error}"  # en:e22c21ee
