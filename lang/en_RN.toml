network_about = "everthang PimpMyShell uses the internet fer, and a proxy to send any of it through. ain't no account, no analytics and no ads: nuthin about you or yer pee-see gits sent nowhere."  # en:78400f6b
proxy_about = "socks5h:// looks names up through the proxy too; socks5:// looks em up on dis pee-see. add user:password@ 'fore the host if'n it needs em. leave it empty fer none"  # en:0b7184b2
proxy_isolate = "a random user name and password fer each"  # en:8c8f5b8b
proxy_isolate_about = "fer Tor's stream isolation: each a the uses below goes with a user name and password a its own, made up every time PimpMyShell starts and kept till it quits, so Tor puts em on circuits a their own. ever TwaTV's stream gets one a its own too, fer long as it plays. they take the place of any in the address, and each use shows its own below"  # en:799b3d07
proxy_limits = "we test all a dis as we build it, but ain't nuthin airtight, least of all the software PimpMyShell gits from somewheres else fer ya, like Streamlink: it does its own networkin, and changes with its own releases.\n\nif'n it matters that nuthin gits out 'cept through yer proxy, have winders make sure. Windows Firewall, or another filter built on the Windows Filtering Platform, kin keep these from goin anywhere but yer proxy:\n\npmsd.exe, pms-gui.exe, pms-twatch.exe, and the python.exe in PimpMyShell's streamlink folder, which runs Streamlink"  # en:14121b01
network_unread = "PimpMyShell can't tell if'n you wanted a proxy, so nuthin goes online till pms-network.toml is fixed: no checkin who's on, no Twatch TV video, no update checks and no downloads. fix the file and save it, or apply a proxy here to replace it. to go without a proxy, delete the file."  # en:41a296b3
proxy_unused = "ain't nuthin goin through yer proxy"  # en:561f4010
proxy_unused_about = "everthang still goes straight to where it's goin. switch on whut oughta use the proxy below, or pick turn on all."  # en:8014a516
proxy_strict = "whut's switched on here never goes without the proxy: if'n the proxy can't be reached, it fails till it kin. whut's switched off goes straight to where it's goin."  # en:116ce13a
network_else = "that's all of it. winders does whut it does by itself, and the notifications PimpMyShell shows come from yer apps, not from the internet. under each use above is the programs that do it, PimpMyShell's own and Streamlink, by their file names."  # en:b70a2e85
