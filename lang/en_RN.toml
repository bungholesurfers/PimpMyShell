tv_about = "a lil tee-vee in yer taskbar. point at it fer its clicker: channels, shuffle, power, and another tee-vee if'n one ain't enough. channel 37 is Number One, the space station's pee tank: it's down yonder. channel 304 is the PIMPBOX, yer game box: its games is under PIMPBOX."  # en:64cec15b
