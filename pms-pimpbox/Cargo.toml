# GPL, unlike the rest of PimpMyShell: this is a program of its own, on an engine under the GPL (see COPYING). It's a
# workspace of its own too, so nothing in PimpMyShell's links it: all the two share is frames in shared memory (pms-screen).
[workspace]
members = [".", "engine", "boot"]
resolver = "3"

[package]
name = "pms-pimpbox"
version = "0.1.7"
edition = "2024"
license = "GPL-2.0-only"
description = "PIMPBOX: a console on a screen in the taskbar, and the PIMPBOX (room), the Doom engine it plays games with"
publish = false

[dependencies]
room = { path = "engine" }
pms-screen = { path = "../pms-screen" }
# The boot animation: MIT, and a program of its own.
pimpbox-boot = { path = "boot", features = ["system-fonts"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = true

[lints.rust]
# Set by `cargo xtask pgo-instrument`: an instrumented build, which writes its profile before going with its parent.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pms_pgo)"] }
