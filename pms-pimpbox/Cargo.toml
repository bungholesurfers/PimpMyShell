# GPL, unlike the rest of PimpMyShell: this is a program of its own, on an engine under the GPL (see COPYING). It's a
# workspace of its own too, so nothing in PimpMyShell's links it: all the two share is frames in shared memory (pms-screen).
[workspace]
members = [".", "engine", "boot", "poom"]
# What a build here builds: the console and its game, two programs.
default-members = [".", "poom"]
resolver = "3"

[package]
name = "pms-pimpbox"
version = "0.1.9"
edition = "2024"
license = "GPL-2.0-only"
description = "PIMPBOX: a console on a screen in the taskbar, which plays games with POOM (pms-poom, on room, the Doom engine)"
publish = false

[dependencies]
# The game, pms-poom.exe: what goes between the two. Not the engine, which is the game's alone.
pms-poom = { path = "poom" }
pms-screen = { path = "../pms-screen" }
# What it says, in the language PimpMyShell speaks (MIT, the texts in lang/): only the little it says itself.
pms-lang = { path = "../pms-lang" }
# How the game is started: a helper in a job of its own, which may start nothing.
pms-spawn = { path = "../pms-spawn" }
# The boot animation: MIT, and a program of its own.
pimpbox-boot = { path = "boot", features = ["system-fonts"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# The icon (drawn in build.rs from the boot animation's mark) and version information, put in as PimpMyShell's programs have theirs.
pms-res = { path = "../pms-res" }

[profile.release]
debug = true

[lints.rust]
# Set by `cargo xtask pgo-instrument`: an instrumented build, which writes its profile before going with its parent.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pms_pgo)"] }
