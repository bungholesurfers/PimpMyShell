# Builds PimpMyShell on every push to main and every pull request: `cargo xtask check` (clippy, where warnings are
# errors, and the tests, of the workspace and of what's ours in the PIMPBOX's, which is one of its own; and that every
# handler in the TAP runs through its guard), and a plain release build, whose exes are kept as the run's artifact for
# trying out. Releases, built with fat LTO or PGO and packaged, are release.yml's.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'update/stable.txt'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'update/stable.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml names the compiler and its components; `rustup install` installs them.
      - name: Toolchain
        run: |
          rustup install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      # The whole workspace, xtask (the build tasks) and the dev tools (pms-art, pms-recon) included; then the PIMPBOX.
      # The same as `cargo xtask check` on a PC, so that what passes there passes here.
      - name: Check
        run: cargo xtask check

      # All that ships, the PIMPBOX with it.
      - name: Build
        run: cargo xtask build

      - uses: actions/upload-artifact@v7
        with:
          name: pms-${{ github.sha }}
          path: |
            target/release/pmsd.exe
            target/release/pms.exe
            target/release/pms-gui.exe
            target/release/pms_tap.dll
            target/release/pms-twatch.exe
            target/release/pms-fetch.exe
            target/release/pms-pimpbox.exe
            target/release/pms-poom.exe
            pms.example.toml
          if-no-files-found: error
